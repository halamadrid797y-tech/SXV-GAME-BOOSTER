name: Build SXV Booster APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract ZIP Project
        run: |
          # Mengekstrak file secara diam-diam (quiet) dan menimpa file lama
          unzip -q -o *.zip || true
          
          # Jika folder terbungkus di dalam sxv-native, keluarkan isinya
          if [ -d "sxv-native" ]; then
            cp -a sxv-native/. . || true
          fi
          ls -la

      - name: Fix AndroidX & Memory Limit
        run: |
          # Memaksa AndroidX aktif agar tidak error saat checkDebugAarMetadata
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          # Menambah batas memori Gradle agar tidak crash di cloud
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          # Mengecek ketersediaan gradlew, jika tidak ada pakai gradle bawaan server
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SXV-Booster-APK
          path: app/build/outputs/apk/debug/app-debug.apk
